name: Build MRPGNPC for NukkitPetteriM1Edition

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: mrpgnpc-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MRPGNPC
        uses: actions/checkout@v4

      - name: Checkout NukkitPetteriM1Edition API
        uses: actions/checkout@v4
        with:
          repository: PetteriM1/NukkitPetteriM1Edition
          ref: release
          path: NukkitPetteriM1Edition

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            pom.xml
            NukkitPetteriM1Edition/pom.xml

      - name: Install target server API
        working-directory: NukkitPetteriM1Edition
        run: mvn --batch-mode --no-transfer-progress -DskipTests install

      - name: Build MRPGNPC
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: MRPGNPC-PM1E
          path: target/MRPGNPC-1.2.6-PM1E.jar
          if-no-files-found: error
